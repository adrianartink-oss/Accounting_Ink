name: Deploy PWA (GitHub Pages)

# Baut die App und veröffentlicht sie als statische PWA auf GitHub Pages.
#
# Voraussetzungen (einmalig):
#  1. GitHub Pages muss verfügbar sein: entweder ist das Repo öffentlich
#     oder es besteht ein GitHub-Pro-/Team-Plan (private Repos).
#  2. Repo → Settings → Pages → Source = "GitHub Actions".
#
# Veröffentlicht wird ausschließlich vom Default-Branch `main`; die
# github-pages-Environment-Regel lässt andere Branches ohnehin nicht zu.
# Über "Run workflow" (workflow_dispatch) lässt sich der Deploy manuell anstoßen.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (mit Pages-Basispfad)
        # Basispfad = Repo-Name, damit die Assets unter der Pages-URL
        # https://<owner>.github.io/<repo>/ korrekt geladen werden. Wird aus
        # dem Repo-Namen abgeleitet, damit eine Umbenennung nichts bricht.
        run: npm run build -- --base="/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
